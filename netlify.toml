[build]
  command = "npm run build"
  publish = "dist/wedding-invitation/browser"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: always fall back to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Fingerprinted assets can be cached aggressively
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
